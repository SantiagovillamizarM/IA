# CI de Paddock Global. Los tests usan ClasificadorFalso: nunca llaman a Gemini ni a Ollama.
# Si el repositorio raíz no es paddock_global/, mueve este archivo a <raíz>/.github/workflows/ y deja
# «working-directory: paddock_global» (ya configurado abajo).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: paddock_global

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: paddock_global/requirements*.txt
      - name: Dependencias
        run: |
          python -m pip install -r requirements.txt -r requirements-db.txt -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Ruff
        run: ruff check src tests scripts
      - name: Mypy (dominio y aplicación)
        run: mypy src/paddock/dominio src/paddock/aplicacion
      - name: Pytest con cobertura
        env:
          LLM_PROVIDER: ollama
          STORAGE_BACKEND: json
        run: |
          pytest -q --cov --cov-report=term
          coverage report --include="src/paddock/dominio/*,src/paddock/aplicacion/*,src/paddock/adaptadores/persistencia/*" --fail-under=80
      - name: Auditoría de dependencias
        run: pip-audit -r requirements.txt -r requirements-db.txt

  imagen:
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen Docker
        run: docker build -f despliegue/Dockerfile -t paddock-global:ci .
      - name: Arranque y salud
        run: |
          docker run -d --name paddock -p 127.0.0.1:8501:8501 -e STORAGE_BACKEND=json paddock-global:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8501/_stcore/health && exit 0; sleep 2; done
          docker logs paddock; exit 1
